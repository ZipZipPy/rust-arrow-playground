# Local stack: PostgreSQL, a one-shot seeder and the app.
#
#   docker compose up --build        then open http://localhost:8080
#
# Settings come from the environment or a .env file next to this file (see
# .env.example): SEED_ROWS, APP_PORT, MAX_ROWS, SEED_WORKERS, RUST_LOG,
# POSTGRES_PASSWORD.
name: arrow-playground

x-database-url: &database-url postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/playground

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: playground
    # Tuned for one bulk load followed by large sequential reads. The data is
    # generated, so trading crash durability for speed (synchronous_commit)
    # costs nothing here.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_wal_size=4GB
      - -c
      - synchronous_commit=off
    # Parallel query workers use /dev/shm; Docker's 64 MB default is too small.
    shm_size: 256m
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker
      # and refuse a volume at /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d playground"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    # Not published by default: 5432 is often taken on the host. To reach the
    # database from host tools (psql, DBeaver, `cargo run -- serve`), publish
    # it on another port, then use postgres://postgres:postgres@localhost:5433/playground
    # ports:
    #   - "127.0.0.1:5433:5432"

  # Fills the table on first start and exits. With --if-empty it is a no-op
  # once data exists; to re-seed see README.md ("Re-seed").
  seed:
    image: arrow-playground:local
    command: ["seed", "--if-empty", "--rows", "${SEED_ROWS:-1000000}"]
    environment:
      DATABASE_URL: *database-url
      SEED_WORKERS: ${SEED_WORKERS:-4}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    # The only service with a build section: seed reuses the same image.
    build:
      context: .
    image: arrow-playground:local
    command: ["serve"]
    environment:
      DATABASE_URL: *database-url
      MAX_ROWS: ${MAX_ROWS:-1000000}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    # The runtime image has no curl; bash's /dev/tcp is enough for a probe.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
