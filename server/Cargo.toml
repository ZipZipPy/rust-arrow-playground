[package]
name = "playground"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Serve PostgreSQL rows as JSON, Arrow IPC or Parquet and measure the difference"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "playground"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false, features = ["ipc_compression"] }
axum = { version = "0.8", features = ["http2"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "flate2-zlib-rs", "zstd", "lz4", "brotli", "simdutf8"] }
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_xoshiro = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-postgres = "0.7"
tower-http = { version = "0.7", features = ["cors", "compression-full", "fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
flate2 = "1"
http-body-util = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 4
lto = "thin"
