name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playground_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d playground_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CARGO_TERM_COLOR: always
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/playground_test
    steps:
      - uses: actions/checkout@v7

      # Without arguments rustup installs the toolchain and components named
      # in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image (build, smoke test)
    runs-on: ubuntu-24.04
    env:
      SEED_ROWS: "20000"
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Docker Engine
        uses: docker/setup-docker-action@v5
        with:
          version: v29.9.2

      - uses: docker/setup-buildx-action@v4

      # Tagged with the name docker-compose.yml uses, and loaded into the
      # local engine so the smoke test runs exactly this image.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: arrow-playground:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack (db, seed, app)
        run: docker compose up --detach --wait --wait-timeout 180 --no-build app

      - name: Query every format
        run: |
          set -euo pipefail
          info=$(curl --fail --silent --show-error http://localhost:8080/api/info)
          jq '{seed, datasets: [.datasets[] | {name, row_estimate, max_key}]}' <<<"$info"
          jq --exit-status --argjson rows "$SEED_ROWS" \
            '.seed.state == "complete" and (.datasets[] | select(.name == "orders") | .max_key) == $rows' \
            <<<"$info" >/dev/null
          for dataset in $(jq -r '.datasets[].name' <<<"$info"); do
            for format in json arrow parquet; do
              body="$RUNNER_TEMP/$dataset.$format"
              rows=$(curl --fail --silent --show-error --output "$body" \
                --write-out '%header{x-row-count}' \
                "http://localhost:8080/api/data?dataset=$dataset&format=$format&rows=1000")
              echo "$dataset $format: $rows rows, $(stat --format=%s "$body") bytes"
              test "$rows" = 1000
            done
          done
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
